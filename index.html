const FORM_FONT='Hiragino Mincho ProN,Yu Mincho,serif';
const FORM_SANS='Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif';
let formMeasure;
function splitFormText(value,width,size,font=FORM_FONT){
 if(!formMeasure)formMeasure=document.createElement('canvas').getContext('2d');
 formMeasure.font=`${size}px ${font}`;
 const rows=[];
 for(const paragraph of String(value??'').split('\n')){
  let row='';for(const ch of Array.from(paragraph)){
   if(row&&formMeasure.measureText(row+ch).width>width){rows.push(row);row=ch}else row+=ch;
  }rows.push(row);
 }return rows;
}
class FormPage{
 constructor(id,landscape=false){this.id=id;this.w=landscape?1414:1000;this.h=landscape?1000:1414;this.parts=[];this.n=0;this.landscape=landscape;}
 rect(x,y,w,h,fill='white',stroke='#111',sw=1,r=0){this.parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);}
 line(x1,y1,x2,y2,sw=1,color='#111',dash=''){this.parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}" ${dash?`stroke-dasharray="${dash}"`:''}/>`);}
 path(d,fill='none',stroke='#111',sw=1){this.parts.push(`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`);}
 text(text,x,y,size=15,opts={}){const rows=String(text??'').split('\n');this.parts.push(`<text x="${x}" y="${y}" font-family="${opts.sans?FORM_SANS:FORM_FONT}" font-size="${size}" font-weight="${opts.bold?700:400}" text-anchor="${opts.anchor||'start'}" fill="${opts.color||'#111'}">${rows.map((r,i)=>`<tspan x="${x}" dy="${i?size*(opts.leading||1.28):0}">${esc(r)}</tspan>`).join('')}</text>`);}
 boxText(text,x,y,w,h,size=15,opts={}){const rows=String(text??'').split('\n'),lh=size*(opts.leading||1.25);const py=y+(h-rows.length*lh)/2+size*.88;this.text(text,opts.left?x+7:x+w/2,py,size,{...opts,anchor:opts.left?'start':'middle'});}
 value(value,x,y,w,h,size=17,opts={}){if(value===undefined||value===null||String(value)==='')return;let f=size,rows=splitFormText(value,w-12,f,FORM_SANS);const min=opts.min||11;while(f>min&&rows.length*f*1.15>h-2){f-=.5;rows=splitFormText(value,w-12,f,FORM_SANS)}const overflow=rows.length*f*1.15>h-2;const key=opts.key||'記入欄';this.parts.push(`<g data-overlay-key="${esc(key)}" ${overflow?'data-text-overflow="true"':''}>`);this.boxText(rows.join('\n'),x+3,y,w-6,h,f,{sans:true,left:!opts.center,color:overflow?'#a32424':'#111',leading:1.15});this.parts.push('</g>');}
 cell(label,value,x,y,w,h,labelWidth=150,size=15){this.rect(x,y,w,h);this.line(x+labelWidth,y,x+labelWidth,y+h);this.boxText(label,x,y,labelWidth,h,size);this.value(value,x+labelWidth,y,w-labelWidth,h,17,{key:label});}
 check(x,y,checked=false,size=13){this.rect(x,y,size,size,'white','#111',1);if(checked)this.path(`M ${x+2} ${y+size*.5} l ${size*.25} ${size*.3} l ${size*.5} ${-size*.62}`,'none','#111',1.7);}
 option(label,checked,x,y,size=13,fs=15){this.check(x,y,checked,size);this.text(label,x+size+7,y+size-.5,fs);}
 circle(x,y,checked=false,r=9){if(checked)this.parts.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#111" stroke-width="1.3"/>`);}
 date(value,x,y,w,h,fs=15){const a=dateParts(value),widths=[w*.48,w*.26,w*.26];let dx=x;for(let i=0;i<3;i++){const unit=fs+3;this.boxText(a[i]||'',dx,y,widths[i]-unit,h,fs,{sans:true});this.boxText(['年','月','日'][i],dx+widths[i]-unit,y,unit,h,fs);dx+=widths[i];}}
 section(title,y){this.text(title,40,y,17,{bold:true});}
 arrow(x1,y1,x2,y2,color='#111',sw=1.5,head=8){this.line(x1,y1,x2,y2,sw,color);const a=Math.atan2(y2-y1,x2-x1);this.path(`M ${x2-head*Math.cos(a-.45)} ${y2-head*Math.sin(a-.45)} L ${x2} ${y2} L ${x2-head*Math.cos(a+.45)} ${y2-head*Math.sin(a+.45)}`,'none',color,sw);}
 svg(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${this.w} ${this.h}" role="img" aria-label="${esc(DOCS.find(d=>d.id===this.id)?.name||this.id)}"><rect width="${this.w}" height="${this.h}" fill="white"/>${this.parts.join('')}</svg>`;}
}
function dateParts(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?[m[1],String(+m[2]),String(+m[3])]:[];}

$('#restoreFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('ファイルが大きすぎます。5MB以下のバックアップを選んでください。');const next=validate(JSON.parse(await file.text()));if(!await confirmAction('バックアップの内容に切り替えます。現在の内容を保存していない場合は、先に「バックアップ保存」をしてください。読み込みますか？'))return;if(!CLOUD||cloudAccess?.role==='admin')fillIzumiDefaults(next);state=next;siteId=state.sites[0]?.id||'';companyId=CLOUD&&cloudAccess?.role==='contractor'?cloudAccess.companyId:state.companies[0].id;workerId=state.workers.find(w=>!CLOUD||cloudAccess?.role==='admin'||w.companyId===companyId)?.id||'';loadError=false;previewIds=[];save();render();toast('バックアップを読み込みました。')}catch(err){toast('読み込めませんでした：'+err.message)}finally{e.target.value=''}});
function validate(raw){if(!raw||raw.schemaVersion!==1||!Array.isArray(raw.companies)||!raw.companies.length||!Array.isArray(raw.workers)||!Array.isArray(raw.sites))throw Error('この試作のバックアップ形式ではありません。');let seen=new Set();const identifier=id=>{if(typeof id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(id)||['__proto__','constructor','prototype'].includes(id)||seen.has(id))throw Error('登録IDが不正または重複しています。');seen.add(id);return id};const pick=(r,fields)=>{if(!r||typeof r!=='object'||Array.isArray(r))throw Error('登録情報の形式が不正です。');const o={};for(const f of fields){if(r[f.key]!==undefined){if(typeof r[f.key]!=='string'||r[f.key].length>(f.type==='textarea'?500:120))throw Error('項目の形式・文字数が不正です：'+f.label);if(f.options&&r[f.key]!==''&&!f.options.includes(r[f.key]))throw Error('選択項目の値が不正です。');if(f.type==='date'&&r[f.key]!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(r[f.key]))throw Error('日付の形式が不正です。');o[f.key]=r[f.key]}}return o};const all=g=>g.flatMap(x=>x[1]);if(raw.companies.length>1000||raw.workers.length>5000||raw.sites.length>5000)throw Error('登録件数が上限を超えています。');const companies=raw.companies.map(r=>({id:identifier(r.id),...pick(r,all(COMPANY))}));const companyIds=new Set(companies.map(x=>x.id));const workers=raw.workers.map(r=>{if(!companyIds.has(r.companyId))throw Error('所属会社の参照が不正です。');const w={id:identifier(r.id),companyId:r.companyId,...pick(r,all(WORKER))};for(const [key,n,fs]of[['education',3,EDUCATION],['qualifications',12,QUALIFICATION],['health',2,HEALTH]]){if(!Array.isArray(r[key])||r[key].length!==n)throw Error('追加情報の行数が不正です。');w[key]=r[key].map(row=>pick(row,fs))}return w});const workerIds=new Set(workers.map(x=>x.id));const kyFields=[f('work','作業内容','textarea'),f('leader','リーダー'),f('count','人数'),...[0,1,2].flatMap(i=>[f('risk'+i,'危険','textarea'),f('action'+i,'対策','textarea')])];const sites=raw.sites.map(r=>{if(!Array.isArray(r.companyIds)||!Array.isArray(r.workerIds)||r.companyIds.some(id=>!companyIds.has(id))||r.workerIds.some(id=>!workerIds.has(id)))throw Error('参加会社・作業員の参照が不正です。');if(r.workerIds.some(id=>!r.companyIds.includes(workers.find(w=>w.id===id).companyId)))throw Error('参加作業員と会社が一致しません。');const s={id:identifier(r.id),...pick(r,all(SITE)),companyIds:[...new Set(r.companyIds)],workerIds:[...new Set(r.workerIds)],kyDays:{}};if(!r.kyDays||typeof r.kyDays!=='object'||Array.isArray(r.kyDays)||Object.keys(r.kyDays).length>4000)throw Error('KY日別記録が不正です。');for(const [date,record]of Object.entries(r.kyDays)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('KYの日付が不正です。');if(record.confirmed!==undefined&&typeof record.confirmed!=='boolean')throw Error('KY確認値が不正です。');s.kyDays[date]={...pick(record,kyFields),confirmed:record.confirmed===true}}if(r.kyByCompany!==undefined){if(!r.kyByCompany||typeof r.kyByCompany!=='object'||Array.isArray(r.kyByCompany))throw Error('会社別KY記録が不正です。');s.kyByCompany={};for(const [cid,days]of Object.entries(r.kyByCompany)){if(!companyIds.has(cid)||!days||typeof days!=='object'||Array.isArray(days)||Object.keys(days).length>4000)throw Error('会社別KYの所属・記録が不正です。');s.kyByCompany[cid]={};for(const [date,record]of Object.entries(days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!record||typeof record!=='object'||Array.isArray(record)||(record.confirmed!==undefined&&typeof record.confirmed!=='boolean'))throw Error('会社別KYの日付・確認値が不正です。');s.kyByCompany[cid][date]={...pick(record,kyFields),confirmed:record.confirmed===true};}}}return s});return {schemaVersion:1,companies,workers,sites}}
function inventoryRows(){return [...COMPANY.flatMap(([g,fs])=>fs.map(f=>['会社',g,f.label,f.required?'原本＊':'',f.options?.join('／')||''])),...WORKER.flatMap(([g,fs])=>fs.map(f=>['作業員',g,f.label,f.required?'原本＊':'',f.options?.join('／')||''])),...[['受講記録',EDUCATION],['資格',QUALIFICATION],['健康診断',HEALTH]].flatMap(([g,fs])=>fs.map(f=>['作業員',g,f.label,'',f.options?.join('／')||''])),...SITE.flatMap(([g,fs])=>fs.map(f=>['現場',g,f.label,'',f.options?.join('／')||''])),...['実施日','作業内容','リーダー名','作業員数','危険のポイント1〜3','私達はこうする1〜3','当日の実施・確認（画面のみ）'].map(n=>['KY','日別記録',n,'',''])]}
function helpHtml(){return `<h3>最初の操作</h3><ol><li>「会社登録」で協力会社・一人親方を登録します。</li><li>「作業員登録」で所属会社と本人情報を登録します。</li><li>「現場・参加者」で共通情報と参加者を選びます。</li><li>「書類・印刷」で当日のKYを入力し、出力対象を確認します。</li></ol><p>「記入例で試す」は架空データを追加します。登録する情報と担当会社を確認してから「登録・保存」を押してください。</p><h3>保存</h3><p>「登録・保存」でサーバーへ保存します。同じ専用URLで開けば、別の端末からも登録内容を呼び出せます。登録前の入力は端末にも下書きとして残します。別画面で更新されている場合は上書きを止めます。必要に応じて「バックアップ保存」でJSONを保存してください。JSONは暗号化されていません。</p><h3>提出先の書式と印刷</h3><p>添付写真を見本に、8枚の文字・罫線・図を白地で作り直しています。写真の紙・床・影・傾き・裏写りは印刷しません。登録情報を反映し、書類を選んで「印刷する」を押します。原本写真は「原本を見る」で照合するためだけに残しています。</p><p>KYと労働災害発生時緊急連絡先はA4横、ほかはA4縦です。写真7の労災連絡網は、原本と同じ横向きで連絡順序と親子関係を残しています。氏名・連絡先の現行性は提出前に確認してください。本人同意、KYの実施確認、署名は自動で済ませません。顔写真・資格証の添付管理は未実装です。</p><h3>入口と公開</h3><p>検索結果に掲載しない設定です。会社ごとの専用URLを使用し、データの取得・登録時に利用範囲をサーバーで検証します。イズミ装美は全体、協力会社は自社と担当現場を扱います。専用URLを転送された人も同じ範囲を利用できます。会社登録画面で停止・再発行できます。</p><h3>既存ドメインと費用</h3><p>2026-11-17に system.izumisoubi.co.jp は既存システムの認証画面へリダイレクトし、noindex応答を返すことを確認。DNSの向き先は izumi-management-system.pages.dev。DNSや既存システムには変更を加えていません。</p><p>公開版はSitesの共有サーバーへ登録内容を保存します。新たな有料契約は行っていません。印刷とPDF保存はブラウザで行います。登録データ全体の保存上限は4MBで、超える場合は登録を止めて入力内容を保全します。<a href="https://developers.cloudflare.com/workers/platform/pricing/" target="_blank" rel="noopener noreferrer">Workers公式料金</a> ／ <a href="https://developers.cloudflare.com/d1/platform/pricing/" target="_blank" rel="noopener noreferrer">D1公式料金</a>（確認日2026-11-17）。</p><h3>PDF・印刷</h3>${printHelp()}<h3>原本から整理した入力項目</h3><div class="toolbar"><button id="copyInventory">項目一覧をまとめてコピー</button><button id="downloadInventory">項目一覧をCSV保存</button></div><div id="inventory" class="table-wrap"><table><thead><tr><th>登録先</th><th>区分</th><th>項目</th><th>原本＊</th><th>選択肢</th></tr></thead><tbody>${inventoryRows().map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}

async function confirmAction(message){
 let dialog=$('#confirmActionDialog');if(!dialog){document.body.insertAdjacentHTML('beforeend','<dialog id="confirmActionDialog"><h2>操作の確認</h2><p id="confirmActionText"></p><div class="actions"><button class="primary" id="confirmActionYes">実行する</button><button id="confirmActionNo">キャンセル</button></div></dialog>');dialog=$('#confirmActionDialog');}
 if(dialog.open)return false;$('#confirmActionText').textContent=message;
 return await new Promise(resolve=>{const finish=value=>{dialog.close();resolve(value);};$('#confirmActionYes').onclick=()=>finish(true);$('#confirmActionNo').onclick=()=>finish(false);dialog.oncancel=event=>{event.preventDefault();finish(false);};dialog.showModal();});

let cloudAccess=null,cloudRevision=0,cloudReady=false,cloudDirty=false,cloudEdit=0,cloudBusy=false,cloudExpected=null;
const cloudDraftKey=()=>KEY+'-draft-'+(cloudAccess?.companyId||'admin');
function cloudMessage(text,error=false){$('#saveStatus').textContent=text;$('#saveStatus').classList.toggle('error',error);}
function cloudDraft(){if(!cloudReady)return;cloudDirty=true;cloudEdit++;try{localStorage.setItem(cloudDraftKey(),JSON.stringify({revision:cloudRevision,data:state}));cloudMessage('未登録の変更があります。入力後に「登録・保存」を押してください。');}catch{cloudMessage('下書きを端末に残せません。「登録・保存」でサーバーへ保存してください。',true);}}
async function cloudRequest(path,options={}){const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(cloudExpected&&path!=='/api/session'?{'X-Izumi-Access-Scope':cloudExpected}:{}),...options.headers}});let body;try{body=await response.json();}catch{throw Error('サーバーから正しい応答を受け取れませんでした。');}if(!response.ok){if(response.status===401){cloudMessage('専用URLが停止されたか、有効期限が切れています。専用URLから開き直してください。',true);}throw Error(body.error||body.message||'登録できませんでした。');}return body;}
async function registerRecords(){
 if(!CLOUD){save();toast('このブラウザに登録しました。次回も同じ入力を呼び出せます。');return true;}
 if(!cloudReady||cloudBusy)return false;cloudBusy=true;const edit=cloudEdit,data=JSON.parse(JSON.stringify(state));
 $$('[data-action="saveRecords"]').forEach(b=>b.disabled=true);cloudMessage('サーバーへ登録しています…');
 try{const result=await cloudRequest('/api/state',{method:'PUT',body:JSON.stringify({data,revision:cloudRevision})});cloudRevision=result.revision;if(edit===cloudEdit){cloudDirty=false;try{localStorage.removeItem(cloudDraftKey());}catch{}cloudMessage('サーバーに登録済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));}else{try{localStorage.setItem(cloudDraftKey(),JSON.stringify({revision:cloudRevision,data:state}));}catch{}cloudMessage('登録しました。続けて入力した変更は、もう一度「登録・保存」で登録してください。');}toast('登録しました。次回も呼び出せます。');return true;}
 catch(error){cloudMessage(error.message+' 入力はこの端末の下書きに残しています。',true);toast(error.message);return false;}
 finally{cloudBusy=false;$$('[data-action="saveRecords"]').forEach(b=>b.disabled=false);}
}

async function initializeCloud(){
 if(!CLOUD)return;
 try{
  const token=location.hash.slice(1);if(/^[a-f0-9]{64}$/.test(token)){const session=await cloudRequest('/api/session',{method:'POST',body:JSON.stringify({token})});cloudExpected=session.access.role+':'+(session.access.companyId||'');}
  const result=await cloudRequest('/api/state');if(cloudExpected&&cloudExpected!==result.access.role+':'+(result.access.companyId||''))throw Error('別の会社の画面が開かれています。専用URLから開き直してください。');cloudExpected=result.access.role+':'+(result.access.companyId||'');state=validate(result.data);cloudAccess=result.access;cloudRevision=result.revision;
  companyId=cloudAccess.role==='contractor'?cloudAccess.companyId:(state.companies.find(c=>c.id==='izumi')?.id||state.companies[0].id);
  workerId=state.workers.find(w=>cloudAccess.role==='admin'||w.companyId===companyId)?.id||'';
  siteId=state.sites[0]?.id||'';tab='company';previewIds=[];cloudReady=true;render();
  $('.notice').textContent=cloudAccess.role==='admin'?'管理者用です。会社・作業員・現場を入力し、「登録・保存」で登録してください。協力会社の専用URLは会社登録画面から発行できます。':'自社と担当現場だけ利用できます。入力後は「登録・保存」を押してください。';
  $('header .local').textContent=cloudAccess.role==='admin'?'管理者':'協力会社';
  cloudMessage('サーバーの登録内容を読み込みました。');
  const draft=localStorage.getItem(cloudDraftKey());if(draft){$('.notice').insertAdjacentHTML('afterend','<div class="notice" id="draftNotice">この端末に未登録の下書きがあります。 <button id="restoreDraft">下書きを戻す</button></div>');$('#restoreDraft').onclick=()=>{try{const saved=JSON.parse(draft);if(saved.revision!==cloudRevision){download(JSON.stringify(saved.data,null,2),'未登録の下書き_'+today()+'.json','application/json');toast('別の更新があるため下書きで上書きできません。下書きをファイルに保存しました。');return;}state=validate(saved.data);cloudDraft();render();$('#draftNotice').remove();}catch{toast('下書きを読み込めませんでした。');}};}
 }catch(error){cloudMessage(error.message,true);$('#main').innerHTML='<h1>登録内容を読み込めませんでした</h1><p>入力を始める前に、専用URLから開き直してください。</p>';}
 document.body.classList.remove('cloud-loading');
}
async function manageCompanyLink(){
 const company=currentCompany();if(!company||company.id==='izumi'||cloudAccess?.role!=='admin')return;
 if(!company.name?.trim()){toast('先に会社名を入力してください。');return;}
 if(cloudDirty&&!await registerRecords())return;
 let dialog=$('#linkDialog');if(!dialog){document.body.insertAdjacentHTML('beforeend','<dialog id="linkDialog"><div class="dialogbar"><h2>会社専用URL</h2><button data-close="linkDialog">閉じる</button></div><div id="linkContent"></div></dialog>');dialog=$('#linkDialog');}
 $('#linkContent').innerHTML=`<p><strong>${esc(company.name)}</strong></p><p>このURLを開いた人は、この会社と担当現場だけ利用できます。URLは必要な相手だけに渡してください。</p><div class="actions"><button class="primary" id="issueLink">発行・再発行</button><button id="revokeLink">URLを停止</button></div><div id="issuedLink" style="margin-top:16px"></div>`;
 $('#issueLink').onclick=async()=>{if(!await confirmAction(company.name+' の専用URLを発行します。以前のURLがある場合は使えなくなります。発行しますか？'))return;try{const result=await cloudRequest('/api/links',{method:'POST',body:JSON.stringify({companyId:company.id,action:'issue'})});const url=location.origin+'/#'+result.token;$('#issuedLink').innerHTML='<label class="field"><span>専用URL（発行時だけ表示）</span><textarea id="shareLink" readonly></textarea></label><button id="copyShareLink">URLをコピー</button>';$('#shareLink').value=url;$('#copyShareLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('専用URLをコピーしました。');}catch{$('#shareLink').select();toast('選択したURLをコピーしてください。');}};}catch(error){toast(error.message);}};
 $('#revokeLink').onclick=async()=>{if(!await confirmAction(company.name+' の専用URLを停止します。この会社から利用できなくなります。停止しますか？'))return;try{await cloudRequest('/api/links',{method:'POST',body:JSON.stringify({companyId:company.id,action:'revoke'})});$('#issuedLink').textContent='URLを停止しました。';}catch(error){toast(error.message);}};
 dialog.showModal();
}
window.addEventListener('beforeunload',event=>{if(CLOUD&&cloudDirty){event.preventDefault();event.returnValue='';}});
initializeCloud();

function openPaperEditor(id){
 const doc=DOCS.find(x=>x.id===id);if(!doc)return;
 let title=doc.name,content='';
 if(id==='company')content=groupsHtml(COMPANY,currentCompany(),'company',COMPANY.length,'paper-');
 else if(id==='worker1'||id==='worker2'){
  const worker=effectiveWorker();if(!worker){toast('先に「作業員登録」で対象の作業員を登録・保存してください。');return;}
  content=groupsHtml(WORKER,worker,'worker',WORKER.length,'paper-')+repeatEditor('受講記録（安全衛生教育）',worker.education,EDUCATION,'education')+repeatEditor('資格・免許',worker.qualifications,QUALIFICATION,'qualifications')+repeatEditor('健康診断受診記録',worker.health,HEALTH,'health');
 }else if(id==='ky'){
  const fields=[f('work','当日の作業内容','textarea'),f('leader','リーダー名'),f('count','作業員数','number'),...[0,1,2].flatMap(i=>[f('risk'+i,'危険のポイント '+(i+1),'textarea'),f('action'+i,'私達はこうする '+(i+1),'textarea')])];
  content='<p>実施日：'+esc(kyDate)+'</p><div class="field-grid">'+fields.map(f=>fieldHtml(f,dayRecord(),'ky','paper-')).join('')+'</div>';
 }else if(id==='heat'||id==='emergency')content=groupsHtml(SITE,currentSite(),'site',SITE.length,'paper-');
 else{toast('この書類は指定の固定内容です。');return;}
 let dialog=$('#paperEditDialog');if(!dialog){$('#main').insertAdjacentHTML('beforeend','<dialog id="paperEditDialog"><div class="dialogbar"><h2 id="paperEditTitle"></h2><button data-close="paperEditDialog">閉じる</button></div><p class="subtle">ここで入力した内容は登録情報に反映され、ほかの書類にも使えます。</p><div id="paperEditFields"></div><div class="toolbar"><button class="primary" id="paperEditSave">登録・保存して帳票へ反映</button></div></dialog>');dialog=$('#paperEditDialog');}
 $('#paperEditTitle').textContent=title;$('#paperEditFields').innerHTML=content;
 $('#paperEditSave').onclick=async()=>{if(await registerRecords()){refreshPreview();dialog.close();}};
 applyCloudPermissions();dialog.showModal();
}
$('#main').addEventListener('click',event=>{const button=event.target.closest('[data-edit-doc]');if(button){openPaperEditor(button.dataset.editDoc);return;}const sheet=event.target.closest('#previewPapers [data-sheet]');if(sheet)openPaperEditor(sheet.dataset.sheet);});

// General-use UI. Keep the existing storage key and prescribed print renderer.
const EASY_NAMES={accident:'労災の緊急連絡網',ky:'危険予知活動表（KY）',emergency:'現場の緊急連絡先',company:'協力会社の登録票',worker1:'作業員の基本情報',worker2:'資格・教育・健康診断',heat:'熱中症の処置フロー',sign:'作業中の掲示'};
const EASY_ORDER=['accident','ky','emergency','company','worker1','worker2','heat','sign'];
let easyDoc='accident',easyMoreRows={},easyPreviewTimer;
try{const id=localStorage.getItem(KEY+'-document');if(EASY_ORDER.includes(id))easyDoc=id;if(!localStorage.getItem(KEY+'-easy-ui')){tab='docs';localStorage.setItem(KEY+'-easy-ui','1');}}catch{}
selectedDocs=new Set([easyDoc]);previewIds=[easyDoc];
function ensureContactDefaults(site){
 if(!site||site.accidentDefaultsVersion==='1')return;
 if(!String(site.accidentManagerName||'').trim())site.accidentManagerName='山口 達也';
 if(!String(site.accidentManagerTel||'').trim())site.accidentManagerTel='080-6138-4540';
 ACCIDENT_CONTACTS.forEach((g,i)=>{if(!String(site['accidentGroup'+i]||'').replace(/[\s/／|｜]/g,''))site['accidentGroup'+i]=[g.manager,...g.staff].map(row=>row.join(' / ')).join('\n');if(!site['accidentGroupName'+i])site['accidentGroupName'+i]=g.group;});
 site.accidentDefaultsVersion='1';
}
if(!loadError)state.sites.forEach(ensureContactDefaults);
function easyFields(fields,obj,target,prefix='easy-'){return '<div class="field-grid">'+fields.map(field=>fieldHtml(field,obj,target,prefix)).join('')+'</div>';}
function easySection(title,content,open=false){return `<details class="easy-section" ${open?'open':''}><summary>${esc(title)}</summary><div class="section-content">${content}</div></details>`;}
function easyGroup(title,fields,obj,target,open=false){return easySection(title,easyFields(fields,obj,target),open);}
function easyPick(groups,keys){return groups.flatMap(g=>g[1]).filter(f=>keys.includes(f.key)).sort((a,b)=>keys.indexOf(a.key)-keys.indexOf(b.key));}
function easyContactEditor(){const site=currentSite();ensureContactDefaults(site);return `<p class="subtle">添付いただいた連絡網を入力済みです。変更がある人だけ修正できます。</p>${easyFields([f('accidentManagerName','技術課長の氏名'),f('accidentManagerTel','電話番号','tel')],site,'site')}${publicAccidentContacts().map((g,i)=>easySection(g.group,`${easyFields([f('accidentGroupName'+i,'グループ名')],site,'site')}<div class="contact-head"><span>氏名</span><span>電話番号</span></div>${[g.manager,...g.staff].map(([name,tel],j)=>`<div class="contact-row"><label><span class="sr-only">${esc(g.group)} ${j===0?'責任者':'担当者'+j}の氏名</span><input value="${esc(name)}" data-contact-group="${i}" data-contact-row="${j}" data-contact-col="0" maxlength="20"></label><label><span class="sr-only">${esc(g.group)} ${j===0?'責任者':'担当者'+j}の電話番号</span><input type="tel" inputmode="tel" value="${esc(tel)}" data-contact-group="${i}" data-contact-row="${j}" data-contact-col="1" maxlength="24"></label></div>`).join('')}`,false)).join('')}`;}
function easyCompanyEditor(){const c=currentCompany();if(!c)return '';const basic=COMPANY[0][1],main=['name','kana','representative','tel','address'];return `<label class="field record-picker"><span>登録した会社から選ぶ</span><select id="easyCompany">${options(state.companies,companyId)}</select></label>${c.id==='izumi'?'<p class="prefill">イズミ装美の基本情報・建設業許可は入力済みです。</p>':''}${easyFields(easyPick(COMPANY,main),c,'company')}${easyGroup('その他の基本情報',basic.filter(x=>!main.includes(x.key)),c,'company')}${COMPANY.slice(1).map(([title,fields])=>easyGroup(title,fields,c,'company')).join('')}`;}
function repeatEditor(title,rows,fields,target){const key=(workerId||'')+'-'+target;const filled=rows.reduce((n,row,i)=>Object.values(row).some(v=>String(v??'').trim())?i+1:n,0);const count=Math.min(rows.length,Math.max(easyMoreRows[key]||0,filled,1));return easySection(title,`${rows.slice(0,count).map((row,i)=>`<div class="repeat-row"><h3>${esc(title)} ${i+1}</h3>${easyFields(fields,row,target+'.'+i)}</div>`).join('')}${count<rows.length?`<button data-more-record="${target}" data-more-count="${count+1}">記入欄を追加</button>`:''}`);}
function easyWorkerEditor(extraOnly=false){const w=effectiveWorker();if(!w)return `<div class="empty"><h2>作業員を登録すると、次回から選ぶだけ。</h2><p>所属会社と本人情報は、2枚の登録票に共通で使います。</p><button data-action="newWorker">作業員を追加</button></div>`;let content=`<label class="field record-picker"><span>登録した作業員から選ぶ</span><select id="easyWorker">${options(state.workers,workerId)}</select></label>`;if(!extraOnly){const main=['name','kana','birth','mobile','address','blood'];content+=`<label class="field record-picker"><span>所属会社</span><select id="workerCompany">${options(state.companies,w.companyId)}</select></label>${easyFields(easyPick(WORKER,main),w,'worker')}${easyGroup('本人のその他の情報・緊急連絡先',WORKER[0][1].filter(x=>!main.includes(x.key)),w,'worker')}${WORKER.slice(1).map(([title,fields])=>easyGroup(title,fields,w,'worker')).join('')}`;}content+=repeatEditor('安全衛生教育',w.education,EDUCATION,'education')+repeatEditor('資格・免許',w.qualifications,QUALIFICATION,'qualifications')+repeatEditor('健康診断',w.health,HEALTH,'health');return content;}
function easyKyEditor(){const site=currentSite(),k=dayRecord(),workers=state.workers.filter(w=>site.workerIds.includes(w.id));return `<label class="field record-picker"><span>KYの対象会社</span><select id="printCompany">${options(state.companies,companyId)}</select></label><div class="field-grid"><label class="field"><span>作業日</span><input id="kyDate" type="date" value="${kyDate}"></label>${fieldHtml(f('leader','リーダー名'),k,'ky')}${fieldHtml(f('work','今日の作業内容','textarea'),{...k,work:k.work??site.work??''},'ky')}${fieldHtml(f('count','作業員数','number'),{...k,count:k.count??String(workers.length||'')},'ky')}</div><p class="subtle">作業内容と人数は、現場・参加者の登録から反映します。</p>${[0,1,2].map(i=>easySection('危険のポイントと対策 '+(i+1),easyFields([f('risk'+i,'危険のポイント','textarea'),f('action'+i,'私達はこうする','textarea')],k,'ky'),i===0||Boolean(k['risk'+i]||k['action'+i]))).join('')}<label class="check"><input id="kyConfirmed" type="checkbox" ${k.confirmed?'checked':''}><span>今日のKYを実施し、内容を確認した<small>実施・確認後にチェックしてください。</small></span></label>`;}
function easyEmergencyEditor(includeSite=true){const s=currentSite();return (includeSite?easyFields(easyPick(SITE,['city','address']),s,'site'):'')+easySection('元請け・工事店の担当者',easyFields(SITE[1][1].filter(x=>!['owner','ownerAddress','ownerTel'].includes(x.key)),s,'site'),true)+easySection('電気・水道・ガス・警察など',easyFields(SITE[2][1],s,'site'))+easySection('救急指定病院',easyFields(SITE[3][1],s,'site'));}
function easyDocFields(id){if(id==='accident')return `<div class="prefill"><strong>連絡網は入力済みです</strong><p>添付の氏名・電話番号を入れた状態で印刷できます。</p></div>${easySection('連絡先を変更する',easyContactEditor())}`;if(id==='ky')return easyKyEditor();if(id==='company')return easyCompanyEditor();if(id==='worker1'||id==='worker2')return easyWorkerEditor(id==='worker2');if(id==='emergency')return easyEmergencyEditor();if(id==='heat')return `<p class="prefill">処置フローと元請けの連絡先は入力済みです。</p>${easyFields(easyPick(SITE,['contractorPerson','contractorOfficeTel','contractorMobile']),currentSite(),'site')}`;return '<p class="prefill">文字の入力は不要です。そのまま確認・印刷できます。</p>';}
function renderDocs(s){ensureContactDefaults(s);previewIds=[easyDoc];const doc=DOCS.find(d=>d.id===easyDoc);return `<h1 class="sr-only">書類をつくる</h1><div class="doc-picker"><label class="field"><span>作成する書類</span><select id="easyDocPicker">${EASY_ORDER.map(id=>`<option value="${id}" ${easyDoc===id?'selected':''}>${esc(EASY_NAMES[id])}</option>`).join('')}</select></label><span class="paper-size">A4 ${doc.orientation}</span></div><div class="workbench"><section class="editor-pane" aria-label="書類の入力"><div class="editor-heading"><h2>${esc(EASY_NAMES[easyDoc])}</h2>${['worker1','worker2','company'].includes(easyDoc)?`<button data-action="${easyDoc==='company'?'newCompany':'newWorker'}">追加登録</button>`:''}</div>${easyDocFields(easyDoc)}</section><section class="preview-pane" aria-label="印刷プレビュー"><div class="preview-heading"><h2>印刷プレビュー</h2><button class="primary" data-easy-print="${easyDoc}">この書類を印刷</button></div><p id="printMessage" class="status" role="status"></p><div id="preview"><div id="previewPapers"></div></div><p class="subtle preview-hint">入力内容はプレビューにも反映します。</p></section></div>${easySection('複数の書類をまとめて印刷',`<div class="batch-actions"><button data-easy-all>全て選択</button><button data-easy-none>選択を解除</button></div><div class="batch-docs">${DOCS.map(d=>`<label class="check"><input type="checkbox" data-doc="${d.id}" ${selectedDocs.has(d.id)?'checked':''}><span>${esc(d.name)}<small>A4 ${d.orientation}</small></span></label>`).join('')}</div><button class="primary" data-easy-batch>選択した書類を印刷</button>`)}${easySection('PDF保存・コンビニ印刷の手順',printHelp())}`;}
function renderSite(s){ensureContactDefaults(s);return `<div class="page-head"><div><h1>現場と参加者</h1><p class="subtle">登録した内容を、KYや緊急連絡先で使います。</p></div><button data-action="duplicateSite">この現場を複製</button></div><div class="form-page">${easyFields(easyPick(SITE,['name','address','work']),s,'site')}${easyGroup('管理番号・工事日程・市区町村',easyPick(SITE,['code','start','end','city']),s,'site')}<section class="participants"><h2>参加する会社・一人親方</h2><div class="checks">${state.companies.map(c=>`<label class="check"><input type="checkbox" data-assign="company" value="${esc(c.id)}" ${s.companyIds.includes(c.id)?'checked':''}><span>${esc(c.name||'名称未入力')}</span></label>`).join('')}</div><button data-goto="company">会社を登録・編集</button><h2>参加する作業員</h2><div class="checks">${state.workers.filter(w=>s.companyIds.includes(w.companyId)).map(w=>`<label class="check"><input type="checkbox" data-assign="worker" value="${esc(w.id)}" ${s.workerIds.includes(w.id)?'checked':''}><span>${esc(w.name||'氏名未入力')}<small>${esc(companyName(w.companyId))}</small></span></label>`).join('')||'<p class="subtle">作業員を登録すると、ここで選べます。</p>'}</div><button data-goto="worker">作業員を登録・編集</button></section>${easySection('現場の緊急連絡先・救急病院',easyEmergencyEditor(false))}<div class="toolbar"><button class="primary" data-goto="docs">書類をつくる</button></div></div>`;}
function renderCompany(){return `<div class="page-head"><div><h1>会社を登録</h1><p class="subtle">一度登録すれば、次回から選ぶだけ。</p></div><button data-action="newCompany">会社・一人親方を追加</button></div><div class="form-page">${easyCompanyEditor()}</div>`;}
function renderWorker(){return `<div class="page-head"><div><h1>作業員を登録</h1><p class="subtle">所属会社の情報は、会社登録から反映します。</p></div><button data-action="newWorker">作業員を追加</button></div><div class="form-page">${easyWorkerEditor()}</div>`;}
function refreshPreview(){const root=$('#previewPapers');if(root){root.innerHTML=previewIds.map(id=>paper(id)).join('');$('#preview').hidden=false;}}
function showPreview(){if(!selectedDocs.size){toast('印刷する書類を選んでください。');return false;}previewIds=[...selectedDocs];return true;}
function openPaperEditor(id){easyDoc=id;tab='docs';previewIds=[id];render();$('.editor-pane')?.scrollIntoView({behavior:'smooth',block:'start'});}
async function registerRecords(){if(loadError){toast('保存データを読み込めていません。バックアップを確認してください。');return false;}save();if($('#saveStatus').classList.contains('error')){toast('保存できませんでした。バックアップ保存で入力を残してください。');return false;}toast('登録しました。次回も同じ情報を使えます。');return true;}
function easySelectDocument(id){if(!EASY_ORDER.includes(id))return;easyDoc=id;selectedDocs=new Set([id]);previewIds=[id];try{localStorage.setItem(KEY+'-document',id);}catch{}render();}
function easySyncDefaults(){const s=currentSite();if(!s)return;ensureContactDefaults(s);if(s.contractorOfficeTel===undefined)s.contractorOfficeTel=state.companies.find(c=>c.id==='izumi')?.tel||'';const c=currentCompany();if(c&&c.id!=='izumi'&&!c.name){c.upperCompany??='株式会社イズミ装美';c.primaryCompany??='株式会社イズミ装美';c.sekisuiOffice??='積水ハウスシャーメゾンPM東京株式会社';}const w=currentWorker(),wc=state.companies.find(c=>c.id===w?.companyId);if(w&&wc?.kind==='一人親方')w.workerType??='一人親方';}
const easyOriginalRender=render;
render=function(){easySyncDefaults();easyOriginalRender();};
document.addEventListener('change',e=>{const el=e.target;if(el.id==='easyDocPicker')easySelectDocument(el.value);if(el.id==='easyCompany'){companyId=el.value;render();}if(el.id==='easyWorker'){workerId=el.value;render();}});
$('#main').addEventListener('input',e=>{const el=e.target;if(el.dataset.contactGroup!==undefined){const i=Number(el.dataset.contactGroup),j=Number(el.dataset.contactRow),c=Number(el.dataset.contactCol);const rows=publicAccidentContacts()[i];const values=[rows.manager,...rows.staff];values[j][c]=el.value;currentSite()['accidentGroup'+i]=values.map(row=>row.join(' / ')).join('\n');save();}clearTimeout(easyPreviewTimer);easyPreviewTimer=setTimeout(refreshPreview,250);});
async function easyPrint(ids){const before=selectedDocs;selectedDocs=new Set(ids);try{await printSelected();}finally{selectedDocs=before;previewIds=[easyDoc];}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.easyPrint)easyPrint([b.dataset.easyPrint]);if(b.hasAttribute('data-easy-batch'))easyPrint([...selectedDocs]);if(b.hasAttribute('data-easy-all')||b.hasAttribute('data-easy-none')){selectedDocs=b.hasAttribute('data-easy-all')?new Set(DOCS.map(d=>d.id)):new Set();$$('[data-doc]').forEach(el=>el.checked=selectedDocs.has(el.dataset.doc));}if(b.dataset.moreRecord){easyMoreRows[(workerId||'')+'-'+b.dataset.moreRecord]=Number(b.dataset.moreCount);const section=b.closest('details');const title=section.querySelector('summary').textContent;const oldY=window.scrollY;render();$$('details').find(d=>d.querySelector('summary')?.textContent===title)?.setAttribute('open','');window.scrollTo({top:oldY});}if(b.dataset.action==='newCompany'){const c=currentCompany();if(c&&!c.upperCompany)c.upperCompany='株式会社イズミ装美';if(c&&!c.primaryCompany)c.primaryCompany='株式会社イズミ装美';if(c&&!c.sekisuiOffice)c.sekisuiOffice='積水ハウスシャーメゾンPM東京株式会社';save();}if(b.dataset.action==='newWorker'){const w=currentWorker(),c=state.companies.find(c=>c.id===w?.companyId);if(w&&c?.kind==='一人親方'){w.workerType='一人親方';save();}}});
// Keep the header and navigation compact; all auxiliary actions stay available.
$('header p').textContent='登録した情報で、工事書類をかんたんに。';
$('.notice').textContent='入力はこのブラウザに自動保存されます。';
const nav=$('.tabs');['docs','site','company','worker'].forEach(id=>nav.appendChild($('#tab-'+id)));
Object.entries({docs:'書類をつくる',site:'現場・参加者',company:'会社',worker:'作業員'}).forEach(([id,label])=>$('#tab-'+id).textContent=label);
$('.topbar .actions').hidden=true;
$('#sitePicker').setAttribute('aria-label','作成する現場');
$('.topbar .site-picker>label').textContent='現場を選ぶ';
const easyUtility=document.createElement('details');easyUtility.className='easy-section utility';easyUtility.innerHTML='<summary>バックアップ・使い方</summary><div class="actions"></div>';$('.shell').insertBefore(easyUtility,$('footer'));['backup','restoreButton','helpButton','demo'].forEach(id=>easyUtility.querySelector('.actions').appendChild($('#'+id)));
$('#helpContent').innerHTML='<h3>使い方</h3><ol><li>書類を選び、必要な項目だけ入力します。</li><li>会社・作業員は一度登録すると選んで再利用できます。</li><li>「登録・保存」で保存し、プレビューを確認して印刷します。</li></ol><h3>保存先</h3><p>入力はこの端末のブラウザに保存されます。別端末へ移す場合は「バックアップ保存」「バックアップ読込」を使ってください。</p><h3>連絡網</h3><p>ご提供いただいた写真の内容を初期登録しています。連絡先の更新があれば「連絡先を変更する」から修正できます。</p>'+printHelp();

render();if(!CLOUD&&!loadError)save();
